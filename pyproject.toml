[project]
name = "transcribe3"
version = "0.1.0"
description = "Transcript validation and enrichment pipeline — local, open-weight, speaker-attributed"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # Audio pipeline (Phase 2) — core dependencies, not optional:
    # `uv run` re-syncs to defaults and would strip these if they were extras
    "whisperx>=3.1",
    "pyannote.audio>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
# Apple Silicon GPU backend for transcription, as an alternative to the
# default CPU-only whisperx backend.
mlx = [
    "mlx-whisper>=0.4",
]

[project.scripts]
transcribe3 = "transcribe3.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
asyncio_mode = "auto"
